<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f6f9fc;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 560px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 8px;
        padding: 24px;
        border: 1px solid #e5e7eb;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
        color: #111827;
      }
      p {
        color: #374151;
        line-height: 1.6;
      }
      .button {
        display: inline-block;
        margin-top: 16px;
        background: #2563eb;
        color: #fff !important;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 6px;
        font-weight: 600;
      }
      .muted {
        color: #6b7280;
        font-size: 12px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Скидання паролю</h1>
      <p>Вітаємо, {{name}}!</p>
      <p>
        Ви запросили скидання паролю. Натисніть кнопку нижче, щоб встановити
        новий пароль. Посилання дійсне протягом 15 хвилин.
      </p>
      <p>
        <a class="button" href="{{link}}" target="_blank" rel="noopener"
          >Скинути пароль</a
        >
      </p>
      <p class="muted">Якщо ви не робили цей запит, проігноруйте цей лист.</p>
    </div>
  </body>
</html>
